    type: "fixed"
    month: 2
    day: 14

  - name: "Mardi Gras"
    type: "easter"
    offset_start_days: -47 # 47 days before Easter
    offset_end_days: -47

  - name: "St. Patrick's Day"
    type: "fixed"
    month: 3
    day: 17

  - name: "Good Friday"
    type: "easter"
