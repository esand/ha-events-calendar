    observed: true

  - name: "Canada Day"
    type: "fixed"
    month: 7
    day: 1
    observed: true

  - name: "Civic Holiday"
    type: "relative"
    month: 8
    weekday: 0     # Monday
    week_number: 1 # 1st Monday of August

  - name: "Labour Day"
    type: "relative"
    month: 9
    weekday: 0     # Monday
    week_number: 1 # 1st Monday of September

  - name: "Truth & Reconciliation Day"
    type: "fixed"
    month: 9
    day: 30
    observed: true

  - name: "Thanksgiving"
    type: "relative"
    month: 10
    weekday: 0     # Monday
    week_number: 2 # 2nd Monday of October

  - name: "Halloween"
    type: "fixed"
    month: 10
    day: 31

  - name: "Remembrance Day"
    type: "fixed"
    month: 11
    day: 11
    observed: true

  - name: "Christmas Day"
    type: "fixed"
    month: 12
    day: 25
    observed: true

  - name: "Boxing Day"
    type: "fixed"
    month: 12
    day: 26
    observed: true

  - name: "New Year's Eve"
    type: "fixed"
    month: 12
    day: 31

